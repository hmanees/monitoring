modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: "ip4"
      method: GET
      valid_http_versions: ["HTTP/1.1","HTTP/2"]

  https_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      tls_config:
        insecure_skip_verify: false
      valid_http_versions: ["HTTP/1.1","HTTP/2"]
